<title>Gestion App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --border-subtle: #f1f5f9;
    --text: #0f172a;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --accent: #059669;
    --accent-hover: #047857;
    --accent-soft: #ecfdf5;
    --accent-soft-text: #047857;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-soft: #fef2f2;
    --danger-soft-text: #b91c1c;
    --overlay: rgba(15, 23, 42, 0.44);
    --shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.18), 0 4px 12px -4px rgba(15, 23, 42, 0.10);
    --focus-ring: rgba(5, 150, 105, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b1220;
      --surface: #121b2e;
      --border: #253247;
      --border-subtle: #1a2436;
      --text: #e7ebf3;
      --text-secondary: #94a1b8;
      --text-muted: #64708a;
      --accent: #10b981;
      --accent-hover: #34d399;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --accent-soft-text: #34d399;
      --danger: #f87171;
      --danger-hover: #fca5a5;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --danger-soft-text: #f87171;
      --overlay: rgba(0, 0, 0, 0.6);
      --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.55), 0 4px 12px -4px rgba(0, 0, 0, 0.4);
      --focus-ring: rgba(16, 185, 129, 0.35);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1220;
    --surface: #121b2e;
    --border: #253247;
    --border-subtle: #1a2436;
    --text: #e7ebf3;
    --text-secondary: #94a1b8;
    --text-muted: #64708a;
    --accent: #10b981;
    --accent-hover: #34d399;
    --accent-soft: rgba(16, 185, 129, 0.14);
    --accent-soft-text: #34d399;
    --danger: #f87171;
    --danger-hover: #fca5a5;
    --danger-soft: rgba(248, 113, 113, 0.14);
    --danger-soft-text: #f87171;
    --overlay: rgba(0, 0, 0, 0.6);
    --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.55), 0 4px 12px -4px rgba(0, 0, 0, 0.4);
    --focus-ring: rgba(16, 185, 129, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Inter Tight", "Inter", sans-serif; text-wrap: balance; margin: 0; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  table { border-collapse: collapse; }
  ::selection { background: var(--accent-soft); color: var(--accent-soft-text); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---------- Layout ---------- */
  #app-root { display: flex; min-height: 100vh; background: var(--bg); }

  .sidebar {
    display: none;
    flex-direction: column;
    width: 236px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    transition: width 0.18s ease;
  }
  .sidebar.collapsed { width: 64px; }
  @media (min-width: 860px) { .sidebar { display: flex; } }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    border-bottom: 1px solid var(--border-subtle);
    min-width: 0;
  }
  .sidebar.collapsed .sidebar-brand { justify-content: center; padding: 16px 8px; }
  .brand-badge {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .sidebar-nav { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
  .nav-btn {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 12px; border: none; background: transparent; border-radius: 8px;
    font-weight: 500; font-size: 13.5px; color: var(--text-secondary); text-align: left;
  }
  .sidebar.collapsed .nav-btn { justify-content: center; padding: 9px 0; }
  .nav-btn:hover { background: var(--border-subtle); }
  .nav-btn.active { background: var(--accent-soft); color: var(--accent-soft-text); }
  .nav-btn svg { flex-shrink: 0; }

  .sidebar-collapse-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-top: 1px solid var(--border-subtle); background: transparent;
    padding: 12px; font-size: 12px; font-weight: 500; color: var(--text-muted);
  }
  .sidebar-collapse-btn:hover { background: var(--border-subtle); color: var(--text-secondary); }

  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .mobile-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  @media (min-width: 860px) { .mobile-topbar { display: none; } }
  .mobile-topbar button { background: none; border: none; color: var(--text-secondary); display: flex; }
  .mobile-topbar .title { font-weight: 600; font-size: 13.5px; }

  .main-content { flex: 1; padding: 20px 16px 40px; }
  @media (min-width: 640px) { .main-content { padding: 24px 24px 48px; } }
  @media (min-width: 1024px) { .main-content { padding: 28px 32px 56px; } }

  /* ---------- Mobile nav overlay ---------- */
  .mobile-nav-overlay { position: fixed; inset: 0; z-index: 70; display: none; }
  .mobile-nav-overlay.open { display: flex; }
  .mobile-nav-backdrop { position: absolute; inset: 0; background: var(--overlay); }
  .mobile-nav-panel {
    position: relative; z-index: 1; width: 260px; height: 100%;
    background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column;
  }
  @media (min-width: 860px) { .mobile-nav-overlay { display: none !important; } }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 8px;
    padding: 9px 15px; font-size: 13.5px; font-weight: 500; border: 1px solid transparent;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: transparent; color: var(--text-secondary); border-color: var(--border); }
  .btn-secondary:hover { background: var(--border-subtle); }
  .btn-danger-outline { background: transparent; color: var(--danger); border-color: var(--danger-soft); }
  .btn-danger-outline:hover { background: var(--danger-soft); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: var(--danger-hover); }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: none; padding: 9px 14px; }
  .btn-ghost:hover { background: var(--border-subtle); }
  .btn:focus-visible, .nav-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .icon-btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .icon-btn {
    border: none; background: transparent; color: var(--text-muted); border-radius: 6px;
    padding: 6px; display: inline-flex;
  }
  .icon-btn:hover { background: var(--border-subtle); color: var(--text-secondary); }
  .icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

  /* ---------- View header ---------- */
  .view-header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 18px;
  }
  .view-title { font-size: 18px; font-weight: 700; }
  .view-subtitle { margin-top: 3px; font-size: 13px; color: var(--text-secondary); }

  .period-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .period-btn { border: none; background: transparent; border-radius: 6px; padding: 6px 12px; font-size: 12.5px; font-weight: 500; color: var(--text-secondary); }
  .period-btn.active { background: var(--accent); color: #fff; }

  /* ---------- KPI + dashboard ---------- */
  .kpi-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .kpi-label { font-size: 12.5px; color: var(--text-secondary); }
  .kpi-value { margin-top: 6px; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi-value.danger { color: var(--danger); }
  .kpi-change { margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
  .kpi-change.positive { color: var(--accent-soft-text); }
  .kpi-change.negative { color: var(--danger); }

  .dash-grid { margin-top: 16px; display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 1024px) { .dash-grid { grid-template-columns: 2fr 1fr; } }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; }

  .chart-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
  .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

  .activity-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .activity-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
  .activity-name { font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity-date { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
  .activity-amount { flex-shrink: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .activity-amount.pos { color: var(--accent-soft-text); }
  .activity-amount.neg { color: var(--danger); }

  /* ---------- Search ---------- */
  .search-bar { position: relative; max-width: 340px; margin-bottom: 16px; }
  .search-bar svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search-bar input { width: 100%; padding: 9px 12px 9px 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); }

  /* ---------- Table ---------- */
  .table-card { overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow-x: auto; }
  table { width: 100%; font-size: 13.5px; min-width: 480px; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; color: var(--text-muted); padding: 11px 14px; border-bottom: 1px solid var(--border-subtle); }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-subtle); color: var(--text); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--border-subtle); }
  td.num { font-weight: 700; font-variant-numeric: tabular-nums; }
  td.num.pos { color: var(--accent-soft-text); }
  td.num.neg { color: var(--danger); }
  td.actions { text-align: right; white-space: nowrap; }
  .col-sm { display: none; } .col-md { display: none; }
  @media (min-width: 640px) { .col-sm { display: table-cell; } }
  @media (min-width: 768px) { .col-md { display: table-cell; } }
  tr.row-hidden { display: none; }

  .badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 600; }
  .badge-green { background: var(--accent-soft); color: var(--accent-soft-text); }
  .badge-red { background: var(--danger-soft); color: var(--danger-soft-text); }

  /* ---------- Empty state ---------- */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 56px 20px; border: 1px dashed var(--border); border-radius: 12px; }
  .empty-icon { margin-bottom: 12px; border-radius: 999px; background: var(--border-subtle); color: var(--text-muted); padding: 10px; display: inline-flex; }
  .empty-title { font-weight: 600; color: var(--text); }
  .empty-subtitle { margin-top: 4px; font-size: 13px; color: var(--text-muted); }
  .no-results { padding: 28px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* ---------- Modal / confirm ---------- */
  .overlay-backdrop { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: var(--overlay); padding: 20px; }
  .modal { width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); }
  .modal-header h3 { font-size: 14.5px; font-weight: 700; }
  .modal-body { padding: 18px 20px 20px; }

  .confirm-box { width: 100%; max-width: 380px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; }
  .confirm-icon { flex-shrink: 0; border-radius: 999px; background: var(--danger-soft); color: var(--danger); padding: 8px; display: inline-flex; }
  .confirm-title { font-weight: 700; }
  .confirm-msg { margin-top: 4px; font-size: 13px; color: var(--text-secondary); }
  .confirm-actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 8px; }

  /* ---------- Forms ---------- */
  .field { display: block; margin-bottom: 13px; }
  .field-label { display: block; margin-bottom: 5px; font-size: 12.5px; font-weight: 500; color: var(--text-secondary); }
  .field-label .req { color: var(--danger); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input[type="text"], input[type="email"], input[type="number"], input[type="date"], select, textarea {
    width: 100%; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 9px 11px;
  }
  input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 1; }
  select option { background: var(--surface); color: var(--text); }
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text);
    -webkit-box-shadow: 0 0 0 1000px var(--surface) inset;
    box-shadow: 0 0 0 1000px var(--surface) inset;
    transition: background-color 9999s ease-in-out 0s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
  input.has-error { border-color: var(--danger); }
  textarea { resize: vertical; font-family: inherit; }
  .field-error { display: block; margin-top: 4px; font-size: 11.5px; color: var(--danger); }
  .form-actions { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: flex-end; gap: 8px; }

  /* ---------- Toast ---------- */
  #toast-layer { position: fixed; bottom: 18px; right: 18px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
  .toast { display: flex; align-items: center; gap: 8px; border-radius: 9px; padding: 11px 16px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); color: #fff; background: var(--text); animation: toast-in 0.16s ease; }
  .toast.error { background: var(--danger); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .settings-wrap { max-width: 560px; }
  .demo-note { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
</style>

<div id="app-root"></div>
<div id="modal-layer"></div>
<div id="confirm-layer"></div>
<div id="toast-layer"></div>

/* ================= Helpers ================= */
function uid() { return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9); }
function todayStr() { var d = new Date(); return d.toISOString().slice(0, 10); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function formatCurrency(amount, currency) {
  try { return new Intl.NumberFormat("fr-CA", { style: "currency", currency: currency || "CAD" }).format(amount || 0); }
  catch (e) { return (amount || 0).toFixed(2) + " $"; }
}
function formatDate(dateStr) {
  try { return new Date(dateStr).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }); }
  catch (e) { return dateStr; }
}
function sumMontant(list) { return list.reduce(function (s, it) { return s + (Number(it.montant) || 0); }, 0); }
function inPeriod(dateStr, period, now) {
  var d = new Date(dateStr);
  if (period === "mois") return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  if (period === "mois-dernier") {
    var pm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return d.getFullYear() === pm.getFullYear() && d.getMonth() === pm.getMonth();
  }
  if (period === "annee") return d.getFullYear() === now.getFullYear();
  return true;
}
function pctChange(cur, prev) { return prev > 0 ? ((cur - prev) / prev) * 100 : (cur > 0 ? 100 : null); }

/* ================= Storage =================
   All data lives in a Supabase Postgres database, called directly from the
   browser over its REST API (PostgREST) — every viewer of this page reads
   and writes the same shared tables, so the app's state is truly shared
   across everyone who has the link. */
function sbHeaders(extra) {
  var h = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}
async function sbGet(table, query) {
  var res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?" + (query || "select=*"), { headers: sbHeaders() });
  if (!res.ok) throw new Error("GET " + table + " failed (" + res.status + ")");
  return res.json();
}
async function sbInsert(table, row) {
  var res = await fetch(SUPABASE_URL + "/rest/v1/" + table, { method: "POST", headers: sbHeaders({ Prefer: "return=minimal" }), body: JSON.stringify(row) });
  if (!res.ok) throw new Error("INSERT " + table + " failed (" + res.status + ")");
}
async function sbUpdate(table, id, patch) {
  var res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id), { method: "PATCH", headers: sbHeaders({ Prefer: "return=minimal" }), body: JSON.stringify(patch) });
  if (!res.ok) throw new Error("PATCH " + table + " failed (" + res.status + ")");
}
async function sbDelete(table, id) {
  var res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id), { method: "DELETE", headers: sbHeaders() });
  if (!res.ok) throw new Error("DELETE " + table + " failed (" + res.status + ")");
}
async function sbDeleteAll(table) {
  var res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?id=not.is.null", { method: "DELETE", headers: sbHeaders() });
  if (!res.ok) throw new Error("DELETE ALL " + table + " failed (" + res.status + ")");
}

/* DB rows use snake_case columns; the app's in-memory objects stay camelCase
   (clientId, createdAt, updatedAt) — these convert at the boundary. */
function clientToDb(c) { return { id: c.id, name: c.name, email: c.email || "", phone: c.phone || "", notes: c.notes || "", created_at: c.createdAt, updated_at: c.updatedAt }; }
function clientFromDb(r) { return { id: r.id, name: r.name, email: r.email, phone: r.phone, notes: r.notes, createdAt: r.created_at, updatedAt: r.updated_at }; }
function revenuToDb(r) { return { id: r.id, date: r.date, client_id: r.clientId || null, montant: r.montant, categorie: r.categorie, description: r.description || "", created_at: r.createdAt, updated_at: r.updatedAt }; }
function revenuFromDb(r) { return { id: r.id, date: r.date, clientId: r.client_id, montant: Number(r.montant), categorie: r.categorie, description: r.description, createdAt: r.created_at, updatedAt: r.updated_at }; }
function depenseToDb(d) { return { id: d.id, date: d.date, montant: d.montant, categorie: d.categorie, description: d.description || "", created_at: d.createdAt, updated_at: d.updatedAt }; }
function depenseFromDb(d) { return { id: d.id, date: d.date, montant: Number(d.montant), categorie: d.categorie, description: d.description, createdAt: d.created_at, updatedAt: d.updated_at }; }
function vehiculeToDb(v) { return { id: v.id, name: v.name, make: v.make || "", model: v.model || "", year: v.year || "", plate: v.plate || "", notes: v.notes || "", created_at: v.createdAt, updated_at: v.updatedAt }; }
function vehiculeFromDb(v) { return { id: v.id, name: v.name, make: v.make, model: v.model, year: v.year, plate: v.plate, notes: v.notes, createdAt: v.created_at, updatedAt: v.updated_at }; }
function inventaireToDb(i) { return { id: i.id, name: i.name, quantity: i.quantity, unit: i.unit || "", category: i.category || "", min_threshold: i.minThreshold === "" || i.minThreshold == null ? null : i.minThreshold, notes: i.notes || "", created_at: i.createdAt, updated_at: i.updatedAt }; }
function inventaireFromDb(i) { return { id: i.id, name: i.name, quantity: Number(i.quantity), unit: i.unit, category: i.category, minThreshold: i.min_threshold === null ? "" : Number(i.min_threshold), notes: i.notes, createdAt: i.created_at, updatedAt: i.updated_at }; }

/* ================= State ================= */
var state = {
  clients: [], revenus: [], depenses: [], vehicules: [], inventaire: [], settings: DEFAULT_SETTINGS,
  activeView: "dashboard", sidebarCollapsed: false, mobileNavOpen: false,
  dashboardPeriod: "mois"
};

async function init() {
  try {
    var results = await Promise.all([
      sbGet("clients", "select=*&order=created_at.asc"),
      sbGet("revenus", "select=*&order=date.desc"),
      sbGet("depenses", "select=*&order=date.desc"),
      sbGet("settings", "select=*")
    ]);
    state.clients = results[0].map(clientFromDb);
    state.revenus = results[1].map(revenuFromDb);
    state.depenses = results[2].map(depenseFromDb);
    state.settings = results[3][0] ? { companyName: results[3][0].company_name, currency: results[3][0].currency } : DEFAULT_SETTINGS;

    if (state.clients.length === 0 && state.revenus.length === 0 && state.depenses.length === 0) {
      var demo = buildDemoData();
      for (var i = 0; i < demo.clients.length; i++) await sbInsert("clients", clientToDb(demo.clients[i]));
      await Promise.all(
        demo.revenus.map(function (r) { return sbInsert("revenus", revenuToDb(r)); })
          .concat(demo.depenses.map(function (d) { return sbInsert("depenses", depenseToDb(d)); }))
      );
      state.clients = demo.clients; state.revenus = demo.revenus; state.depenses = demo.depenses;
    }
  } catch (e) {
    console.error(e);
    showToast("error", "Connexion à la base de données impossible. Vérifiez votre connexion et rechargez la page.");
  }

  // Loaded independently: a missing/not-yet-created table here (e.g. a new
  // feature whose SQL hasn't been run yet) shouldn't break the whole app.
  try {
    state.vehicules = (await sbGet("vehicules", "select=*&order=created_at.asc")).map(vehiculeFromDb);
  } catch (e) { console.error(e); state.vehicules = []; }
  try {
    state.inventaire = (await sbGet("inventaire", "select=*&order=created_at.asc")).map(inventaireFromDb);
  } catch (e) { console.error(e); state.inventaire = []; }

  render();
}

/* ================= Toast / confirm / modal shells ================= */
function showToast(type, message) {
  var layer = document.getElementById("toast-layer");
  var el = document.createElement("div");
  el.className = "toast" + (type === "error" ? " error" : "");
  el.setAttribute("role", "status");
  el.innerHTML = icon(type === "error" ? "alertCircle" : "checkCircle", 16) + "<span>" + esc(message) + "</span>";
  layer.appendChild(el);
  setTimeout(function () { el.remove(); }, 3000);
}

function openConfirm(message, onConfirm) {
  var layer = document.getElementById("confirm-layer");
  layer.innerHTML =
    '<div class="overlay-backdrop" data-close="confirm">' +
      '<div class="confirm-box" role="dialog" aria-modal="true">' +
        '<div style="display:flex;align-items:flex-start;gap:12px;">' +
          '<div class="confirm-icon">' + icon("alertCircle", 18) + '</div>' +
          '<div><p class="confirm-title">Confirmer la suppression</p><p class="confirm-msg">' + esc(message) + '</p></div>' +
        '</div>' +
        '<div class="confirm-actions">' +
          '<button class="btn btn-ghost" data-close="confirm">Annuler</button>' +
          '<button class="btn btn-danger" id="confirm-ok-btn">Supprimer</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById("confirm-ok-btn").addEventListener("click", function () { closeConfirm(); onConfirm(); });
}
function closeConfirm() { document.getElementById("confirm-layer").innerHTML = ""; }

function openModal(title, bodyHtml, onMount) {
  var layer = document.getElementById("modal-layer");
  layer.innerHTML =
    '<div class="overlay-backdrop" data-close="modal">' +
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-header"><h3>' + esc(title) + '</h3><button class="icon-btn" data-close="modal" aria-label="Fermer">' + icon("x", 17) + '</button></div>' +
        '<div class="modal-body">' + bodyHtml + '</div>' +
      '</div>' +
    '</div>';
  if (onMount) onMount(layer);
}
function closeModal() { document.getElementById("modal-layer").innerHTML = ""; }

document.addEventListener("click", function (e) {
  var closeTarget = e.target.closest("[data-close]");
  if (closeTarget && (closeTarget === e.target || closeTarget.classList.contains("overlay-backdrop"))) {
    if (e.target === closeTarget) {
      var kind = closeTarget.getAttribute("data-close");
      if (kind === "modal") closeModal(); else closeConfirm();
    }
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeModal(); closeConfirm(); }
});

/* ================= CRUD =================
   Each action updates in-memory state and re-renders immediately (optimistic),
   then writes to Supabase. If that write fails, the local change is rolled
   back and an error toast explains it wasn't saved — there is no local
   fallback store, since the whole point is that everyone sees the same data. */
async function saveClient(data, id) {
  var prev = state.clients;
  var row = id
    ? Object.assign({}, state.clients.find(function (c) { return c.id === id; }), data, { updatedAt: Date.now() })
    : Object.assign({ id: uid(), createdAt: Date.now(), updatedAt: Date.now() }, data);
  state.clients = id ? state.clients.map(function (c) { return c.id === id ? row : c; }) : state.clients.concat([row]);
  closeModal(); render();
  try {
    if (id) await sbUpdate("clients", id, clientToDb(row)); else await sbInsert("clients", clientToDb(row));
    showToast("success", id ? "Client mis à jour." : "Client ajouté.");
  } catch (e) { state.clients = prev; render(); showToast("error", "L'enregistrement a échoué. Réessayez."); }
}
function deleteClient(client) {
  openConfirm("Supprimer « " + client.name + " » ? Cette action est irréversible.", async function () {
    var prev = state.clients;
    state.clients = state.clients.filter(function (c) { return c.id !== client.id; });
    closeConfirm(); render();
    try { await sbDelete("clients", client.id); showToast("success", "Client supprimé."); }
    catch (e) { state.clients = prev; render(); showToast("error", "La suppression a échoué. Réessayez."); }
  });
}

      state.clients = []; state.revenus = []; state.depenses = [];
      render();
      showToast("success", "Toutes les données ont été effacées.");
    } catch (e) { showToast("error", "L'opération a échoué. Réessayez."); render(); }
  });
}

/* ================= Chart ================= */
function buildChartSVG() {
  var now = new Date();
  var months = [];
  for (var i = 5; i >= 0; i--) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ label: d.toLocaleDateString("fr-FR", { month: "short" }), year: d.getFullYear(), month: d.getMonth() });
  }
  var data = months.map(function (m) {
    return {
      name: m.label,
      rev: sumMontant(state.revenus.filter(function (r) { var rd = new Date(r.date); return rd.getFullYear() === m.year && rd.getMonth() === m.month; })),
      dep: sumMontant(state.depenses.filter(function (dd) { var d2 = new Date(dd.date); return d2.getFullYear() === m.year && d2.getMonth() === m.month; }))
    };
  });
  var w = 640, h = 230, padL = 46, padR = 8, padT = 10, padB = 26;
  var plotW = w - padL - padR, plotH = h - padT - padB;
  var maxVal = Math.max(1, Math.max.apply(null, data.map(function (x) { return Math.max(x.rev, x.dep); })));
  var niceMax = maxVal * 1.2;
  var groupW = plotW / data.length;
  var barW = Math.min(20, groupW / 2 - 6);

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" role="img" aria-label="Revenus et dépenses des 6 derniers mois">';
  for (var g = 0; g <= 3; g++) {
    var gy = padT + plotH - (g / 3) * plotH;
    var val = (g / 3) * niceMax;
    svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="var(--border)" stroke-width="1"/>';
    svg += '<text x="' + (padL - 8) + '" y="' + (gy + 3) + '" font-size="10.5" text-anchor="end" fill="var(--text-muted)">' + shortNum(val) + '</text>';
  }
  data.forEach(function (m, idx) {
    var x0 = padL + idx * groupW;
    var revH = (m.rev / niceMax) * plotH, depH = (m.dep / niceMax) * plotH;
    var bx1 = x0 + groupW / 2 - barW - 2, bx2 = x0 + groupW / 2 + 2;
    svg += '<rect x="' + bx1 + '" y="' + (padT + plotH - revH) + '" width="' + barW + '" height="' + revH + '" rx="2.5" fill="var(--accent)"><title>Revenus ' + m.name + ': ' + formatCurrency(m.rev, state.settings.currency) + '</title></rect>';
    svg += '<rect x="' + bx2 + '" y="' + (padT + plotH - depH) + '" width="' + barW + '" height="' + depH + '" rx="2.5" fill="var(--danger)"><title>Dépenses ' + m.name + ': ' + formatCurrency(m.dep, state.settings.currency) + '</title></rect>';
    svg += '<text x="' + (x0 + groupW / 2) + '" y="' + (h - 8) + '" font-size="11" text-anchor="middle" fill="var(--text-secondary)">' + esc(m.name) + '</text>';
  });
  svg += '</svg>';
  return svg;
}
function shortNum(v) { if (v >= 1000) return (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + "k"; return Math.round(v).toString(); }

/* ================= View renderers ================= */
function renderDashboard() {
  var now = new Date();
  var periods = [{ id: "mois", label: "Ce mois" }, { id: "mois-dernier", label: "Mois dernier" }, { id: "annee", label: "Cette année" }, { id: "tout", label: "Tout" }];
  var filteredRevenus = state.revenus.filter(function (r) { return inPeriod(r.date, state.dashboardPeriod, now); });
  var filteredDepenses = state.depenses.filter(function (d) { return inPeriod(d.date, state.dashboardPeriod, now); });
  var totalRevenus = sumMontant(filteredRevenus), totalDepenses = sumMontant(filteredDepenses);
  var benefice = totalRevenus - totalDepenses;
  var marge = totalRevenus > 0 ? (benefice / totalRevenus) * 100 : 0;

  var curMonthRev = sumMontant(state.revenus.filter(function (r) { return inPeriod(r.date, "mois", now); }));
  var prevMonthRev = sumMontant(state.revenus.filter(function (r) { return inPeriod(r.date, "mois-dernier", now); }));
  var curMonthDep = sumMontant(state.depenses.filter(function (d) { return inPeriod(d.date, "mois", now); }));
  var prevMonthDep = sumMontant(state.depenses.filter(function (d) { return inPeriod(d.date, "mois-dernier", now); }));

  var revChange = pctChange(curMonthRev, prevMonthRev);
  var depChangeRaw = pctChange(curMonthDep, prevMonthDep);
  var depChange = depChangeRaw === null ? null : -depChangeRaw;

  function kpiChangeHtml(pct) {
    if (pct === null || isNaN(pct) || !isFinite(pct)) return "";
    var positive = pct >= 0;
    return '<p class="kpi-change ' + (positive ? "positive" : "negative") + '">' + icon(positive ? "arrowUpRight" : "arrowDownRight", 13) + Math.abs(pct).toFixed(0) + '% vs mois dernier</p>';
  }

  var recentActivity = state.revenus.map(function (r) { return Object.assign({}, r, { kind: "revenu" }); })
    .concat(state.depenses.map(function (d) { return Object.assign({}, d, { kind: "depense" }); }))
    .sort(function (a, b) { return new Date(b.date) - new Date(a.date); }).slice(0, 6);

  function clientName(id) { var c = state.clients.find(function (x) { return x.id === id; }); return c ? c.name : "—"; }

  var activityHtml = recentActivity.length === 0
    ? '<p class="no-results">Aucune activité pour l\'instant.</p>'
    : '<ul class="activity-list">' + recentActivity.map(function (item) {
        var label = item.kind === "revenu" ? (clientName(item.clientId) || "Revenu") : item.categorie;
        return '<li class="activity-item"><div style="min-width:0;"><p class="activity-name">' + esc(label) + '</p><p class="activity-date">' + formatDate(item.date) + '</p></div>' +
          '<span class="activity-amount ' + (item.kind === "revenu" ? "pos" : "neg") + '">' + (item.kind === "revenu" ? "+" : "−") + formatCurrency(item.montant, state.settings.currency) + '</span></li>';
      }).join("") + '</ul>';

  return (
    '<div class="view-header"><div><h1 class="view-title">Tableau de bord</h1><p class="view-subtitle">Vue d\'ensemble de ' + esc(state.settings.companyName) + '</p></div>' +
    '<div class="period-toggle">' + periods.map(function (p) {
      return '<button class="period-btn ' + (state.dashboardPeriod === p.id ? "active" : "") + '" data-action="set-period" data-period="' + p.id + '">' + p.label + '</button>';
    }).join("") + '</div></div>' +
    '<div class="kpi-grid">' +
      '<div class="card"><p class="kpi-label">Revenus</p><p class="kpi-value">' + formatCurrency(totalRevenus, state.settings.currency) + '</p>' + kpiChangeHtml(revChange) + '</div>' +
      '<div class="card"><p class="kpi-label">Dépenses</p><p class="kpi-value">' + formatCurrency(totalDepenses, state.settings.currency) + '</p>' + kpiChangeHtml(depChange) + '</div>' +
      '<div class="card"><p class="kpi-label">Bénéfice net</p><p class="kpi-value' + (benefice < 0 ? " danger" : "") + '">' + formatCurrency(benefice, state.settings.currency) + '</p></div>' +
      '<div class="card"><p class="kpi-label">Marge</p><p class="kpi-value">' + marge.toFixed(1) + '%</p></div>' +
    '</div>' +
    '<div class="dash-grid">' +
      '<div class="card"><p class="card-title">Revenus vs dépenses — 6 derniers mois</p>' + buildChartSVG() +
        '<div class="chart-legend"><span><span class="legend-dot" style="background:var(--accent)"></span>Revenus</span><span><span class="legend-dot" style="background:var(--danger)"></span>Dépenses</span></div></div>' +
      '<div class="card"><p class="card-title">Activité récente</p>' + activityHtml + '</div>' +
    '</div>'
  );
}

        '<button class="icon-btn" data-action="close-mobile-nav" aria-label="Fermer">' + icon("x", 18) + '</button></div>' +
        '<nav class="sidebar-nav">' + navHtml(false) + '</nav></div>' +
    '</div>' +
    '<div class="main-col">' +
      '<div class="mobile-topbar"><button data-action="open-mobile-nav" aria-label="Menu">' + icon("menu", 21) + '</button>' +
        '<span class="title">' + esc(viewLabel) + '</span><span style="width:21px"></span></div>' +
      '<main class="main-content">' + viewFns[state.activeView]() + '</main>' +
    '</div>';

  if (state.activeView === "clients") wireSearch("client-search-input", "clients-tbody", "[data-client-row]", "clients-no-results");
  if (state.activeView === "revenus") wireSearch("revenu-search-input", "revenus-tbody", "[data-revenu-row]", "revenus-no-results");
  if (state.activeView === "depenses") wireSearch("depense-search-input", "depenses-tbody", "[data-depense-row]", "depenses-no-results");
  if (state.activeView === "vehicules") wireSearch("vehicule-search-input", "vehicules-tbody", "[data-vehicule-row]", "vehicules-no-results");
  if (state.activeView === "inventaire") wireSearch("inventaire-search-input", "inventaire-tbody", "[data-inventaire-row]", "inventaire-no-results");
  if (state.activeView === "parametres") wireSettingsForm();
}

function wireSearch(inputId, tbodyId, rowSelector, noResultsId) {
  var input = document.getElementById(inputId);
  if (!input) return;
  input.addEventListener("input", function () {
    var q = input.value.trim().toLowerCase();
    var rows = document.querySelectorAll("#" + tbodyId + " tr" + rowSelector);
    var visible = 0;
    rows.forEach(function (row) {
      var match = row.getAttribute("data-search").indexOf(q) !== -1;
      row.classList.toggle("row-hidden", !match);
      if (match) visible++;
    });
    var noResults = document.getElementById(noResultsId);
    if (noResults) noResults.style.display = (visible === 0 && q) ? "block" : "none";
  });
}
function wireSettingsForm() {
  var form = document.getElementById("settings-form");
  if (!form) return;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var fd = new FormData(form);
    saveSettings({ companyName: (fd.get("companyName") || "").trim() || "Mon entreprise", currency: fd.get("currency") });
  });
}

/* ================= Modal forms ================= */
function fieldHtml(label, name, opts) {
  opts = opts || {};
  var attrs = 'name="' + name + '" id="f-' + name + '" autocomplete="off"';
  if (opts.tag !== "textarea" && opts.tag !== "select") attrs += ' type="' + (opts.type || "text") + '"';
  if (opts.step) attrs += ' step="' + opts.step + '"';
  if (opts.min !== undefined) attrs += ' min="' + opts.min + '"';
  if (opts.placeholder) attrs += ' placeholder="' + esc(opts.placeholder) + '"';
  if (opts.value !== undefined) attrs += ' value="' + esc(opts.value) + '"';
  if (opts.autofocus) attrs += ' autofocus';
  var input = opts.tag === "textarea"
    ? '<textarea ' + attrs + ' rows="3">' + esc(opts.value || "") + '</textarea>'
    : opts.tag === "select"
      ? '<select ' + attrs + '>' + opts.options + '</select>'
      : '<input ' + attrs + '>';
  return '<label class="field"><span class="field-label">' + label + (opts.required ? ' <span class="req">*</span>' : '') + '</span>' + input + '</label>';
}

function openClientModal(mode, data) {
  var isEdit = mode === "edit";

    '<div id="client-name-error" class="field-error" style="display:none;margin:-9px 0 10px;"></div>' +
    fieldHtml("Courriel", "email", { type: "email", value: data && data.email, placeholder: "contact@exemple.ca" }) +
    fieldHtml("Téléphone", "phone", { value: data && data.phone, placeholder: "514-555-0100" }) +
    fieldHtml("Notes", "notes", { tag: "textarea", value: data && data.notes, placeholder: "Notes internes…" }) +
    '<div class="form-actions"><button type="button" class="btn btn-ghost" data-close="modal">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>' +
    '</form>';
  openModal(isEdit ? "Modifier le client" : "Ajouter un client", body, function (layer) {
    var f = document.getElementById("client-form");
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var name = f.name.value.trim();
      var errEl = document.getElementById("client-name-error");
      if (!name) { errEl.textContent = "Le nom est requis."; errEl.style.display = "block"; f.name.classList.add("has-error"); return; }
      saveClient({ name: name, email: f.email.value.trim(), phone: f.phone.value.trim(), notes: f.notes.value.trim() }, data && data.id);
    });
    f.name.addEventListener("input", function () { document.getElementById("client-name-error").style.display = "none"; f.name.classList.remove("has-error"); });

  });

/* ================= Global click delegation ================= */
document.addEventListener("click", function (e) {
  var btn = e.target.closest("[data-action]");
  if (!btn) return;
  var action = btn.getAttribute("data-action");
  var id = btn.getAttribute("data-id");
  switch (action) {
    case "nav": navigate(btn.getAttribute("data-view")); break;
    case "toggle-sidebar": state.sidebarCollapsed = !state.sidebarCollapsed; render(); break;
    case "open-mobile-nav": state.mobileNavOpen = true; render(); break;
    case "close-mobile-nav": state.mobileNavOpen = false; render(); break;
    case "set-period": state.dashboardPeriod = btn.getAttribute("data-period"); render(); break;
    case "open-client-modal": openClientModal("add"); break;
    case "edit-client": openClientModal("edit", state.clients.find(function (c) { return c.id === id; })); break;
    case "delete-client": deleteClient(state.clients.find(function (c) { return c.id === id; })); break;
    case "open-vehicule-modal": openVehiculeModal("add"); break;
    case "edit-vehicule": openVehiculeModal("edit", state.vehicules.find(function (v) { return v.id === id; })); break;
    case "delete-vehicule": deleteVehicule(state.vehicules.find(function (v) { return v.id === id; })); break;
    case "open-inventaire-modal": openInventaireModal("add"); break;
    case "edit-inventaire": openInventaireModal("edit", state.inventaire.find(function (i) { return i.id === id; })); break;
    case "delete-inventaire": deleteInventaireItem(state.inventaire.find(function (i) { return i.id === id; })); break;
    case "open-revenu-modal": openRevenuModal("add"); break;
    case "edit-revenu": openRevenuModal("edit", state.revenus.find(function (r) { return r.id === id; })); break;
    case "delete-revenu": deleteRevenu(state.revenus.find(function (r) { return r.id === id; })); break;
    case "open-depense-modal": openDepenseModal("add"); break;
    case "edit-depense": openDepenseModal("edit", state.depenses.find(function (d) { return d.id === id; })); break;
    case "delete-depense": deleteDepense(state.depenses.find(function (d) { return d.id === id; })); break;
    case "reset-demo": resetDemoData(); break;
    case "clear-all": clearAllData(); break;
  }
});

init().catch(function (e) { console.error(e); showToast("error", "Le chargement a échoué."); });
</script>
